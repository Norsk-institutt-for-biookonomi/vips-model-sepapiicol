name=Septoria apiicola model
description=<p>This model calculates infection risk of Celery leaf spot (alt. Septoria late blight) (<em>Septoria apiicola</em>) using weather data and forecasts. The risk alerts apply to celery but are also relevant for parsley blight (<em>Septoria petroselini</em>) in parsley.</p> <p>In Norway, celery leaf spot occurs sporadically, and the model is recommended as a tool to help determine when to intensify field inspections prior to the first detection of symptoms.</p> <p>{{filename="/images/septoriaapiicola.jpg" description="Celery leaf spot in celery. (Photo: Erling Fl&oslash;istad, NIBIO)"}}<br /> <em>Celery leaf spot in celery. (Photo: Erling Fl&oslash;istad, NIBIO)</em></p> <p>The model for celery leaf spot is based on a calculation of when weather conditions are wet enough for the fungus to sporulate and cause infection in susceptible host plants.</p> <p>Infection risk alerts are issued when a minimum of 12 consecutive hours of leaf wetness is recorded. Wetness periods are calculated based on leaf wetness measured 30 cm above ground level. At weather stations without ground-level sensors, leaf wetness measured at 2 m is used. Weather data is obtained from weather stations affiliated with the Agrometeorological service (<a href="https://lmt.nibio.no" target="_blank" rel="noopener">Landbruksmeteorologisk Tjeneste (LMT)</a>) and from 2-day forecasts by the <a href="https://met.no" target="_blank" rel="noopener">Norwegian Meteorological Institute</a>.</p> <h2>Interpretation of warnings</h2> <p>Red alert means high risk of infection and symptoms of celery leaf spot have been reported from the area/region association with the current weather station. Yellow alert means the weather conditions indicate risk of infections, but there are no recorded symptoms in the area. Green means no estimated risk of infection.</p> <p>Model calculations are updated daily, based on observed weather data to present time and 2-day weather forecasts. Field observations and registration of celery leaf spot are carried out in collaboration with the Norwegian Agricultural Advisory Service.</p> <p>{{filename="/images/chart_SEPAPIICOL.png" description="Screenshot from detailed model outputs for celery leaf spot."}}<br/><em>Screenshot from detailed model outputs for celery leaf spot. Blue bars indicate periods of at least 12 consecutive hours of leaf wetness. Black bar indicates date of first field observation of Septoria leaf spot. Green, yellow and red background colors correspond to daily alert status on VIPSweb home page and in the table under detailed model outputs.</em></p> <h2>Season of model operation</h2> <p>Risk alerts are issued from weather stations in areas with celery production. The model is active from June through September. Please contact VIPS (<a href="mailto:vips@nibio.no">vips@nibio.no</a>) if there&rsquo;s a wish for model calculations at additional weather stations, or a need for adjustments of the operating period.</p> <p>Risk alerts for all activated weather stations are automatically displayed at VIPSweb front page map. A <a href="https://www.vips-landbruk.no/information/35/" target="_blank" rel="noopener">private setup</a> with individually selected start and stop dates is available by use of private weather stations and weather stations affiliated with the LMT-network. See <a href="https://www.vips-landbruk.no/information/27/" target="_blank" rel="noopener">user guide</a>. </p> <h2>Test and validation of the model</h2> <p>The model is developed in Michigan, USA and published by Lacy (1994). In Norway, field trials with studies of weather conditions, spore formation and infection conditions were carried out at &Aring;s during the period 2012-2016. The results showed that the model generally performs well, although its accuracy is slightly reduced during periods of rainfall (Nordskog and Le, 2014).</p> <h2>Recommendations for model use in Norway</h2> <p>The model for celery leaf spot is a tool to help assess when to look for early symptoms in the field. It is not considered accurate enough for timing of fungicide applications under Norwegian conditions.</p> <p>It is recommended to intensify field inspections after periods with risk alerts to detect early <br />infections of celery leaf blight. If inoculum is present, infections are expected to develop 7-14 days after a period of infection risk alerts (yellow or red warnings).</p> <p>For disease management, please contact your local agricultural advisor for assessment of current plant protection strategies.</p> <p></p> <h2>References</h2> <p>Lacy, M.L. 1994. Influence of wetness periods on infection of celery by Septoria apiicola and use in timing sprays for control. Plant Disease 78, 975-979.</p> <p>Nordskog, B. and Le, V.H. 2015. Varsling av selleribladflekk [Forecast of celery late blight]. Gartneryrket nr 6, s14-15. (Norwegian text)</p> <p>Celery leaf spot description: <a href="https://plantevernleksikonet.no/l/oppslag/479/" target="_blank" rel="noopener">Plantevernleksikonet</a></p> <p>Contact person: <a href="https://nibio.no/en/employees/berit-nordskog" target="_blank" rel="noopener">Berit Nordskog</a></p>
statusInterpretation=<p>Red &ndash; high risk of infection. Symptoms of celery leaf spot has been reported from the area/region association with the current weather station.</p> <p>Yellow &ndash; possible risk of infection. Weather conditions indicate risk of infections, but there are no recorded symptoms in the area.</p> <p>Green &ndash; no calculated risk of infection.</p> <p>Grey - no calculations available/model is not operative.</p> <p>Model output details:</p> <p>Graph legend - Blue bars indicate periods of at least 12 consecutive hours of leaf wetness. Black bar indicate date of first field observation of celery leaf spot.</p> <p>Green, yellow and red background colors correspond to daily alert status on VIPSweb home page and in the table under detailed model outputs.</p>
usage=Description of required input parameters:\n\ntimeZone - What timezone the calculation is for. Necessary to calculate daily values from the provided hourly values. See this list of time zones: http://en.wikipedia.org/wiki/List_of_tz_database_time_zones (Column "TZ")\n\nobservations - list of weather data. The following parameters are required:\n* BT - Leaf wetness (minutes/hour)\n\nThe weather data must be hourly data\n\npestObservations - registrations of the pest in the field. See sample config for structure. The only parameter necessary is the date of the observation. This parameter is not mandatory, it should only be provided if you actually have at least one pest observation
