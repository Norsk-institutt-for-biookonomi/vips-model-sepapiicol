name=Selleribladflekkmodell
description=<p>Modellen beregner om det er fare for infeksjon av selleribladflekk (<em>Septoria apiicola</em>) basert p&aring; v&aelig;rdata og v&aelig;rprognoser. Varslene gjelder for selleri, men er relevante ogs&aring; for persillebladflekk (<em>Septoria petroselini</em>) i persille.</p> <p>Selleribladflekk opptrer sporadisk, og modellen anbefales brukt som hjelpemiddel for n&aring;r en b&oslash;r intensivere feltinspeksjoner f&oslash;r f&oslash;rste funn av symptomer.</p> <p>{{filename="/images/septoriaapiicola.jpg" description="Selleribladflekk i selleri (Foto: E. Fl&oslash;istad, NIBIO)"}}<br/><em>Selleribladflekk i selleri. (Foto: Erling Fl&oslash;istad, NIBIO)</em></p> <p>Modellen for selleribladflekk er basert p&aring; en beregning av n&aring;r v&aelig;rforholdene er fuktige nok til at soppen kan danne sporer og for&aring;rsake infeksjon i mottakelige vertplanter.</p> <p>Varsler om infeksjonsfare gis n&aring;r det er registrert minimum 12 timer sammenhengende bladfuktighet. Fuktighetsperiodene beregnes fra registrert bladfuktighet 30 cm over bakken. Ved m&aring;lestasjoner som ikke har sensor p&aring; bakkeniv&aring; brukes bladfuktighet m&aring;lt ved 2 m. V&aelig;rdata hentes fra v&aelig;rstasjoner tilknyttet <a href="https://lmt.nibio.no" target="_blank" rel="noopener">Landbruksmeteorologisk Tjeneste</a> (LMT) og 2-d&oslash;gns v&aelig;rprognoser fra <a href="https://met.no" target="_blank" rel="noopener">Meteorologisk Institutt</a>.</p> <h2>Tolking av varsel</h2> <p>R&oslash;dt varsel betyr fare for infeksjon og angrep av selleribladflekk er observert i omr&aring;de/region med tilknytning til gjeldende v&aelig;rstasjon. Gult varsel betyr at v&aelig;rforhold tilsier fare for infeksjon, men ingen registrerte angrep i omr&aring;det. Gr&oslash;nt betyr at det ikke er beregnet fare for infeksjon.</p> <p>Modellberegninger oppdateres daglig og viser varsler basert p&aring; registrerte v&aelig;rdata frem til dagens dato og 2-d&oslash;gns v&aelig;rprognoser. Observasjoner og registrering av selleribladflekk utf&oslash;res i samarbeid med Norsk Landbruksr&aring;dgiving.</p> <p>{{filename="/images/chart_SEPAPIICOL.png" description="Skjermdump som viser graf med detaljer om varselet i løpet av sesongen."}}<br/><em>Skjermdump fra detaljert varselvisning for selleribladflekk. Grafen viser bl&aring; s&oslash;yler for perioder med minst 12 timer sammenhengende luftfuktighet. Svart s&oslash;yle viser dato for observasjon av selleribladflekk. Gr&oslash;nn, gul, r&oslash;d bakgrunnsfarge samsvarer med daglig varselstatus i kartet p&aring; VIPS-forsida og i tabellen under detaljert varselvisning.</em></p> <h2>Varslingssesong &ndash; oppstart og avslutning av varsel</h2> <p>Varsler beregnes ved v&aelig;rstasjoner i omr&aring;der med selleriproduksjon. Varslene startes 1. juni og avsluttes 30. september. Ta kontakt med VIPS (<a href="mailto:vips@nibio.no">vips@nibio.no</a>) ved &oslash;nske om at modellen skal settes opp for flere v&aelig;rstasjoner, eller ved behov for justert driftsperiode i sesong.</p> <p>Varsler vises automatisk i kartfunksjonen i VIPS-forsida for alle v&aelig;rstasjoner hvor modellen er startet. Modellen kan ogs&aring; settes opp som et <a href="https://www.vips-landbruk.no/information/35/" target="_blank" rel="noopener">privat varsel</a> med egendefinert start og sluttdato. Dette kan gj&oslash;res for private v&aelig;rstasjoner og for v&aelig;rstasjoner som allerede finnes i LMT-databasen. Se <a href="https://www.vips-landbruk.no/information/27/" target="_blank" rel="noopener">brukerveiledning</a></p> <h2>Utpr&oslash;ving og validering av modellen</h2> <p>Modellen er utviklet i Michigan, USA og publisert av Lacy (1994). Feltfors&oslash;k med studier av v&aelig;rforhold, sporedanning og smitteforhold ble utf&oslash;rt p&aring; &Aring;s i perioden 2012-2016. Resultatene viste at modellen treffer bra, men at det kan v&aelig;re noe d&aring;rligere treff p&aring; varsler i sammenheng med nedb&oslash;rsperioder (Nordskog og Le, 2014).</p> <h2>Anbefaling om bruk av modellen</h2> <p>Modellen for selleribladflekk er et hjelpemiddel for &aring; vurdere n&aring;r en b&oslash;r lete etter tidlige symptomer i &aring;keren. Den anses ikke &aring; v&aelig;re n&oslash;yaktig nok for beregning av spr&oslash;yteintervall.</p> <p>Det anbefales &aring; intensivere feltinspeksjoner i etterkant av perioder med varsler. Dersom smitte finnes i omr&aring;det kan det forventes nye angrep 7-14 dager etter varsel om infeksjonsfare (gult eller r&oslash;dt varsel). Ved angrep, ta kontakt med lokal r&aring;dgiver i NLR for vurdering av aktuelle plantevernstrategier.</p> <h2>Referanser</h2> <p>Lacy, M.L. 1994. Influence of wetness periods on infection of celery by Septoria apiicola and use in timing sprays for control. Plant Disease 78, 975-979.</p> <p>Nordskog, B. og Le, V.H. 2015. Varsling av selleribladflekk. Gartneryrket nr 6, s14-15.</p> <p>Mer om selleribladflekk og persillebladflekk finner du i <a href="https://plantevernleksikonet.no/l/oppslag/479/" target="_blank" rel="noopener">Plantevernleksikonet</a></p> <p>Kontaktperson: <a href="https://nibio.no/ansatte/berit-nordskog" target="_blank" rel="noopener">Berit Nordskog</a></p>
statusInterpretation=<ul> <li>R&oslash;dt - fare for infeksjon. Angrep av selleribladflekk er observert i omr&aring;de/region med tilknytning til gjeldende v&aelig;rstasjon.</li> <li>Gult - v&aelig;rforhold tilsier at det er fare for infeksjon, ingen registrerte angrep.</li> <li>Gr&oslash;nt - ingen fare for infeksjon</li> <li>Gr&aring;tt &ndash; varsel beregnes ikke/modellen ikke er i drift</li> </ul> <p>Forklaring av varsel-detaljer:</p> <p>Grafen viser bl&aring; s&oslash;yler for perioder med minst 12 timer sammenhengende luftfuktighet. Svart s&oslash;yle viser dato for observasjon av selleribladflekk.</p> <p>Gr&oslash;nn, gul, r&oslash;d bakgrunnsfarge samsvarer med daglig varselstatus i kartet p&aring; VIPS-forsida og i tabellen under detaljert varselvisning.</p>
usage=Description of required input parameters:\n\ntimeZone - What timezone the calculation is for. Necessary to calculate daily values from the provided hourly values. See this list of time zones: http://en.wikipedia.org/wiki/List_of_tz_database_time_zones (Column "TZ")\n\nobservations - list of weather data. The following parameters are required:\n* BT - Leaf wetness (minutes/hour)\n\nThe weather data must be hourly data\n\npestObservations - registrations of the pest in the field. See sample config for structure. The only parameter necessary is the date of the observation. This parameter is not mandatory, it should only be provided if you actually have at least one pest observation
