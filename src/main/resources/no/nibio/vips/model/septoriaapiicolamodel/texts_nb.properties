name=Selleribladflekkmodell
description={{filename="/images/septoriaapiicola.jpg" description="Selleribladflekk i stangselleri (Foto: E. Fl&oslash;istad, NIBIO)"}}\n<h2>Modellbeskrivelse</h2>\n<p>Modellen er basert p&aring; en enkel beregning av n&aring;r v&aelig;rforholdene er fuktige nok til at soppen kan for&aring;rsake infeksjon i mottakelige vertplanter.</p>\n<p>Varsler om infeksjonsfare gis n&aring;r det er registrert minimum 12 timer sammenhengende bladfuktighet. Fuktighetsperiodene beregnes fra registrert bladfuktighet 30 cm over bakken. Ved m&aring;lestasjoner som ikke har sensor p&aring; bakkeniv&aring; brukes bladfuktighet m&aring;lt ved 2 m.</p>\n<p>Modellen er utviklet i USA og publisert av Lacy (1994).&nbsp;</p>\n<p>Det antas at varslingsmodellen ogs&aring; vil v&aelig;re gyldig for persillebladflekk (Septoria petroselini).</p>\n<h2>Tolking av varsel</h2>\n<p>Dersom smitte er til stede kan det forventes &aring; finne angrep 7-14 dager etter varsel om infeksjonsfare (gult eller r&oslash;dt varsel). Det anbefales &aring; intensivere feltinspeksjoner i etterkant av perioder med varsler.</p>\n<ul>\n<li>Gr&oslash;nne bokser betyr at det ikke er fare for infeksjon</li>\n<li>Gule bokser betyr at v&aelig;rforhold tilsier fare for infeksjon. Ingen registrerte angrep.</li>\n<li>R&oslash;de bokser betyr fare for infeksjon. Angrep av selleribladflekk er observert i omr&aring;de/region med tilknytning til gjeldende v&aelig;rstasjon. Observasjoner og registrering av selleribladflekk utf&oslash;res i samarbeid med r&aring;dgivere i Norsk Landbruksr&aring;dgiving.</li>\n</ul>\n<p>Den grafiske presentasjonen viser bl&aring; s&oslash;yler for perioder med minst 12 timer sammenhengende luftfuktighet. Svart s&oslash;yle viser dato for observasjon av selleribladflekk.</p>\n<h2>Varslingssesong &ndash; oppstart og avslutning av varsel</h2>\n<p>Varsler startes ca 1. juni og avsluttes 30. september.</p>\n<p>Varsler beregnes ved v&aelig;rstasjoner i regioner med kommersiell produksjon av selleri.</p>\n<h2>Utpr&oslash;ving og validering av modellen</h2>\n<h3>Nasjonalt</h3>\n<p>Det arbeides med &aring; validere denne varslingsmodellen under norske forhold. Det anbefales forel&oslash;pig &aring; bruke modellen som hjelpemiddel for n&aring;r en b&oslash;r intensivere feltinspeksjoner.</p>\n<p>Detaljerte studier av v&aelig;rforhold, sporedanning og smitteforhold gjennomf&oslash;res i feltfors&oslash;k p&aring; &Aring;s i perioden 2012-2016. Resultater s&aring; langt viser at modellen treffer bra, men at det kan v&aelig;re behov for enkelte justeringer, spesielt i sammenheng med nedb&oslash;rsperioder (Nordskog og Le, 2014). Eventuelle tilpasninger av modellen gj&oslash;res etter at valideringsfors&oslash;kene er avsluttet.</p>\n<h3>Internasjonalt</h3>\n<p>Modellen er utviklet i Michigan, USA og publisert av Lacy (1994)</p>\n<h2>Referanser</h2>\n<p>Lacy, M.L. 1994. Influence of wetness periods on infection of celery by Septoria apiicola and use in timing sprays for control. Plant Disease 78, 975-979.</p>\n<p>Nordskog, B. og Le, V.H. 2015. Varsling av selleribladflekk. Gartneryrket nr 6, s14-15.</p>\n<p>Mer om selleribladflekk og persillebladflekk finner du i <a href="http://leksikon.nibio.no/vieworganism.php?organismId=1_479" target="_blank">Plantevernleksikonet</a></p>\n<p>&nbsp;</p>
statusInterpretation=<p>Grafen viser bl&aring; s&oslash;yler for perioder med minst 12 timer sammenhengende luftfuktighet. Svart s&oslash;yle viser dato for observasjon av selleribladflekk.</p>\n<p>Gr&oslash;nn, gul, r&oslash;d bakgrunnsfarge samsvarer med daglig varselstatus i kartet p&aring; forsida og i tabellen under.</p>\n<ul>\n<li>Gr&oslash;nn boks: ingen fare for infeksjon</li>\n<li>Gul boks: v&aelig;rforhold tilsier at det er fare for infeksjon, ingen registrerte angrep.</li>\n<li>R&oslash;d boks: fare for infeksjon. Angrep av selleribladflekk er observert i omr&aring;de/region med tilknytning til gjeldende v&aelig;rstasjon.</li>\n</ul>
usage=Description of required input parameters:\n\ntimeZone - What timezone the calculation is for. Necessary to calculate daily values from the provided hourly values. See this list of time zones: http://en.wikipedia.org/wiki/List_of_tz_database_time_zones (Column "TZ")\n\nobservations - list of weather data. The following parameters are required:\n* BT - Leaf wetness (minutes/hour)\n\nThe weather data must be hourly data\n\npestObservations - registrations of the pest in the field. See sample config for structure. The only parameter necessary is the date of the observation. This parameter is not mandatory, it should only be provided if you actually have at least one pest observation
